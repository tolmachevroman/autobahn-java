plugins {
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21' apply false
}

apply plugin: project.IS_ANDROID ? 'com.android.application' : 'application'

if (project.IS_ANDROID) {
    apply plugin: 'org.jetbrains.kotlin.plugin.compose'

    android {
        namespace = "io.crossbar.autobahn.demogallery"
        compileSdk 35

        defaultConfig {
            minSdkVersion 23
            targetSdkVersion 36
        }

        buildFeatures {
            compose true
        }

        buildTypes {
            release {
                minifyEnabled false
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            }
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }

        sourceSets {
            main {
                java {
                    exclude 'io/crossbar/autobahn/demogallery/netty/**'
                }
            }
        }

        packaging {
            resources {
                excludes += [
                    'META-INF/spring.tooling',
                    'META-INF/spring.handlers',
                    'META-INF/spring.schemas',
                    'META-INF/license.txt',
                    'META-INF/notice.txt',
                    'META-INF/INDEX.list'
                ]
            }
        }
    }

    dependencies {
        implementation project(path: ':autobahn')
        implementation project(path: ':autobahn-kotlin-ext')

        // Compose BOM
        def composeBom = platform('androidx.compose:compose-bom:2025.02.00')
        implementation composeBom
        androidTestImplementation composeBom

        // Compose
        implementation 'androidx.compose.ui:ui'
        implementation 'androidx.compose.ui:ui-graphics'
        implementation 'androidx.compose.ui:ui-tooling-preview'
        implementation 'androidx.compose.material3:material3'
        implementation 'androidx.activity:activity-compose:1.10.0'
        implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
        implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

        // AndroidX
        implementation 'androidx.appcompat:appcompat:1.7.1'
        implementation 'com.google.android.material:material:1.13.0'
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

        // Compose tooling
        debugImplementation 'androidx.compose.ui:ui-tooling'
        debugImplementation 'androidx.compose.ui:ui-test-manifest'
    }
} else {
    // Netty build
    application {
        mainClass = 'io.crossbar.autobahn.demogallery.netty.Main'
    }

    dependencies {
        implementation project(path: ':autobahn')
    }

    sourceSets {
        main {
            java {
                include 'io/crossbar/autobahn/demogallery/netty/**'
                include 'io/crossbar/autobahn/demogallery/ExampleClient.java'
                include 'io/crossbar/autobahn/demogallery/data/**'
                exclude 'io/crossbar/autobahn/demogallery/android/**'
            }
        }
    }

    jar {
        version = project.properties.get("buildVersion", "")
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
