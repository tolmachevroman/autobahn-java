// Get build platform from root project extension properties
def IS_ANDROID = rootProject.ext.IS_ANDROID
def IS_NETTY = rootProject.ext.IS_NETTY

if (IS_ANDROID) {
    apply plugin: 'com.android.library'
} else {
    apply plugin: 'java-library'
}
if (!IS_ANDROID) {
    apply plugin: 'org.jetbrains.kotlin.jvm'
}
apply plugin: 'maven-publish'

def groupID = 'io.crossbar.autobahn'
def licenseName = 'MIT'
def licenseUrl = 'https://opensource.org/licenses/MIT'
def relVersion = '22.2'

dependencies {
    // Kotlin standard library
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21'

    api 'com.fasterxml.jackson.core:jackson-core:2.21.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:2.21.0'
    implementation 'org.msgpack:jackson-dataformat-msgpack:0.9.11'
    
    // Cryptography dependencies for WAMP authentication
    implementation 'io.xconn:cryptology:1.1.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    
    // Backport Java 8 APIs for Android API 23 compatibility
    api 'net.sourceforge.streamsupport:streamsupport-cfuture:1.7.4'
    
    if (!IS_ANDROID) {
        implementation 'org.json:json:20240303'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
    }
    
    if (IS_NETTY) {
        implementation 'io.netty:netty-codec-http:4.1.115.Final'
        implementation 'io.netty:netty-handler:4.1.115.Final'
    }
    
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.21.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    
    // For integration tests
    testImplementation 'org.testcontainers:testcontainers:2.0.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.awaitility:awaitility:4.3.0'
}

if (IS_ANDROID) {
    android {
        namespace = "io.crossbar.autobahn"
        defaultConfig {
            compileSdkVersion 35
            minSdkVersion 23
            targetSdkVersion 36
        }
        buildTypes {
            release {
                minifyEnabled false
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            }
        }
        sourceSets {
            main {
                java {
                    exclude 'io/crossbar/autobahn/wamp/transports/Netty*'
                    exclude 'io/crossbar/autobahn/utils/ABJLogger.java'
                }
            }
        }
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
        lint {
            abortOnError = false
        }
        packaging {
            resources {
                excludes += [
                    'META-INF/spring.tooling',
                    'META-INF/spring.handlers',
                    'META-INF/spring.schemas',
                    'META-INF/license.txt',
                    'META-INF/notice.txt'
                ]
            }
        }
    }

    // Use tasks.register for lazy configuration
    tasks.register('sourcesJar', Jar) {
        archiveClassifier.set("sources")
        from android.sourceSets.main.java.srcDirs
    }

    // Simplified javadoc task for Android - AGP 9.0+ removed variant APIs
    tasks.register('javadoc', Javadoc) {
        failOnError = false
        source = android.sourceSets.main.java.sourceFiles
        
        options {
            encoding = 'UTF-8'
            charSet = 'UTF-8'
            noTimestamp = true
        }
        
        // Stub task - full javadoc for Android requires complex AGP 9.0+ setup
        enabled = false
    }

    tasks.register('javadocJar', Jar) {
        archiveClassifier.set("javadoc")
        from javadoc.destinationDir
    }

    base.archivesName = 'autobahn-android'
    group = groupID
    version = relVersion
} else {
    // Netty/Java builds
    tasks.register('sourcesJar', Jar) {
        dependsOn classes
        archiveClassifier.set("sources")
        from sourceSets.main.allSource
    }
    
    tasks.register('javadocJar', Jar) {
        dependsOn javadoc
        archiveClassifier.set("javadoc")
        from javadoc.destinationDir
    }

    sourceSets {
        main {
            java {
                exclude 'io/crossbar/autobahn/wamp/transports/AndroidWebSocket.java'
                exclude 'io/crossbar/autobahn/wamp/transports/WebSocket.java'
                exclude 'io/crossbar/autobahn/websocket'
                exclude 'io/crossbar/autobahn/utils/ABALogger.java'
            }
        }
    }
    
    jar {
        version = relVersion
    }
    
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    
    kotlin {
        jvmToolchain(17)
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                if (IS_ANDROID) {
                    // For Android: publish the release AAR
                    // AGP 9.0+ creates the 'release' component after project evaluation
                    artifactId = 'autobahn-android'
                    
                    // Manually add the AAR artifact
                    artifact("$buildDir/outputs/aar/autobahn-android-release.aar") {
                        builtBy tasks.named('bundleReleaseAar')
                    }
                    
                    // Add dependencies to POM for Android build
                    pom.withXml {
                        def dependenciesNode = asNode().appendNode('dependencies')
                        configurations.api.allDependencies.each {
                            if (it.group != null) {
                                def dependencyNode = dependenciesNode.appendNode('dependency')
                                dependencyNode.appendNode('groupId', it.group)
                                dependencyNode.appendNode('artifactId', it.name)
                                dependencyNode.appendNode('version', it.version)
                                dependencyNode.appendNode('scope', 'compile')
                            }
                        }
                        configurations.implementation.allDependencies.each {
                            if (it.group != null) {
                                def dependencyNode = dependenciesNode.appendNode('dependency')
                                dependencyNode.appendNode('groupId', it.group)
                                dependencyNode.appendNode('artifactId', it.name)
                                dependencyNode.appendNode('version', it.version)
                                dependencyNode.appendNode('scope', 'runtime')
                            }
                        }
                    }
                } else {
                    from components.java
                    artifactId = 'autobahn-java'
                }

                artifact sourcesJar
                artifact javadocJar

                groupId = groupID
                version = relVersion
                
                pom {
                    name = 'Autobahn Java (Fork)'
                    description = 'WebSocket & WAMP for Java8+ and Android API 23+'
                    licenses {
                        license {
                            name = licenseName
                            url = licenseUrl
                        }
                    }
                }
            }
        }
        
        repositories {
            // Publish to local Maven repository
            mavenLocal()
            
            // Publish to GitHub Packages
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/tolmachevroman/autobahn-java")
                credentials {
                    // For local builds, update your global gradle.properties with both variables
                    // GPR_USER must be your Github Username
                    // GPR_KEY must be the classic ghp_XXX token you create on your account tokens
                    // For Github Actions builds, both GITHUB_ACTOR and GITHUB_TOKEN env variables will be
                    // automatically available
                    username = project.findProperty("GPR_USER") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("GPR_KEY") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
