def IS_ANDROID = project.hasProperty('IS_ANDROID') ? project.IS_ANDROID : true
def IS_NETTY = project.hasProperty('IS_NETTY') ? project.IS_NETTY : false

apply plugin: IS_ANDROID ? 'com.android.library' : 'java-library'
apply plugin: 'maven-publish'

def groupID = 'io.crossbar.autobahn'
def licenseName = 'MIT'
def licenseUrl = 'https://opensource.org/licenses/MIT'
def relVersion = System.getenv().containsKey('AUTOBAHN_BUILD_VERSION') ? 
        System.getenv('AUTOBAHN_BUILD_VERSION') : '21.4.2-SNAPSHOT'
def siteUrl = 'https://github.com/crossbario/autobahn-java'

dependencies {
    api 'com.fasterxml.jackson.core:jackson-core:2.21.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:2.21.0'
    implementation 'org.msgpack:jackson-dataformat-msgpack:0.9.11'
    
    // Cryptography dependencies for WAMP authentication
    implementation 'io.xconn:cryptology:1.1.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    
    // Backport Java 8 APIs for Android API 23 compatibility
    api 'net.sourceforge.streamsupport:streamsupport-cfuture:1.7.4'
    
    if (!IS_ANDROID) {
        implementation 'org.json:json:20240303'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
    }
    
    if (IS_NETTY) {
        implementation 'io.netty:netty-codec-http:4.1.115.Final'
        implementation 'io.netty:netty-handler:4.1.115.Final'
    }
    
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.21.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    
    // For integration tests
    testImplementation 'org.testcontainers:testcontainers:2.0.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.awaitility:awaitility:4.3.0'
}

if (IS_ANDROID) {
    android {
        namespace = "io.crossbar.autobahn"
        defaultConfig {
            compileSdkVersion 35
            minSdkVersion 23
            targetSdkVersion 36
        }
        buildTypes {
            release {
                minifyEnabled false
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            }
        }
        sourceSets {
            main {
                java {
                    exclude 'io/crossbar/autobahn/wamp/transports/Netty*'
                    exclude 'io/crossbar/autobahn/utils/ABJLogger.java'
                }
            }
        }
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
        lint {
            abortOnError = false
        }
        packaging {
            resources {
                excludes += [
                    'META-INF/spring.tooling',
                    'META-INF/spring.handlers',
                    'META-INF/spring.schemas',
                    'META-INF/license.txt',
                    'META-INF/notice.txt'
                ]
            }
        }
    }

    // Use tasks.register for lazy configuration
    tasks.register('sourcesJar', Jar) {
        archiveClassifier.set("sources")
        from android.sourceSets.main.java.srcDirs
    }

    tasks.register('javadoc', Javadoc) {
        failOnError = false
        source = android.sourceSets.main.java.sourceFiles
        classpath += files(android.bootClasspath)
        
        options {
            encoding = 'UTF-8'
            charSet = 'UTF-8'
            links('https://docs.oracle.com/javase/8/docs/api/')
        }
    }

    tasks.register('javadocJar', Jar) {
        dependsOn javadoc
        archiveClassifier.set("javadoc")
        from javadoc.destinationDir
    }

    base.archivesName = 'autobahn-android'
    group = groupID
    version = relVersion

    afterEvaluate {
        javadoc.classpath += files(android.libraryVariants.collect { variant ->
            variant.javaCompileProvider.get().classpath.files
        })
    }
} else {
    // Netty/Java builds
    tasks.register('sourcesJar', Jar) {
        dependsOn classes
        archiveClassifier.set("sources")
        from sourceSets.main.allSource
    }
    
    tasks.register('javadocJar', Jar) {
        dependsOn javadoc
        archiveClassifier.set("javadoc")
        from javadoc.destinationDir
    }

    sourceSets {
        main {
            java {
                exclude 'io/crossbar/autobahn/wamp/transports/AndroidWebSocket.java'
                exclude 'io/crossbar/autobahn/wamp/transports/WebSocket.java'
                exclude 'io/crossbar/autobahn/websocket'
                exclude 'io/crossbar/autobahn/utils/ABALogger.java'
            }
        }
    }
    
    jar {
        version = relVersion
    }
    
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                if (IS_ANDROID) {
                    from components.findByName('release')
                    artifactId = 'autobahn-android'
                } else {
                    from components.java
                    artifactId = 'autobahn-java'
                }

                artifact sourcesJar
                artifact javadocJar

                groupId = groupID
                version = relVersion
                
                pom {
                    name = 'Autobahn Java'
                    description = 'WebSocket & WAMP for Java8+ and Android API 23+'
                    url = siteUrl
                    licenses {
                        license {
                            name = licenseName
                            url = licenseUrl
                        }
                    }
                    developers {
                        developer {
                            id = "crossbario"
                            name = "Crossbar.io"
                            email = "support@crossbario.com"
                        }
                    }
                    scm {
                        url = siteUrl
                    }
                }
            }
        }
        
        repositories {
            // Publish to local Maven repository
            mavenLocal()
        }
    }
}
